<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MRH × MANN+HUMMEL — Brand Story Slider</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0B0F0D;
    --ink-soft:#1A211E;
    --paper:#FFFFFF;
    --paper-warm:#F3F4F2;
    --green:#009B48;          /* MANN+HUMMEL green */
    --green-deep:#00713A;
    --grey:#7C847F;
    --hair:#E2E5E2;

    --display:"Archivo","Helvetica Neue",Arial,sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;

    --card-w: 340px;
    --gap: 18px;
    --radius: 4px;
  }

  *{box-sizing:border-box;margin:0;padding:0}

  body{
    font-family:var(--display);
    background:var(--paper);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
    padding:64px 0 88px;
  }

  /* ---------- Section head ---------- */
  .head{
    max-width:1240px;margin:0 auto 34px;padding:0 32px;
    display:flex;align-items:flex-end;justify-content:space-between;gap:32px;
  }
  .eyebrow{
    font-family:var(--mono);
    font-size:11px;letter-spacing:.18em;text-transform:uppercase;
    color:var(--grey);display:flex;align-items:center;gap:10px;
  }
  .eyebrow::before{
    content:"";width:26px;height:1px;background:var(--green);display:block;
  }
  .head h2{
    font-size:clamp(26px,3.4vw,42px);
    font-weight:700;letter-spacing:-.025em;line-height:1.05;
    margin-top:12px;max-width:15ch;
  }
  .head h2 em{font-style:normal;color:var(--green)}
  .head-right{
    font-family:var(--mono);font-size:11px;color:var(--grey);
    letter-spacing:.06em;text-align:right;line-height:1.7;padding-bottom:4px;
    white-space:nowrap;
  }

  /* ---------- Rail ---------- */
  .rail-wrap{position:relative;max-width:1240px;margin:0 auto;padding:0 32px}

  .rail{
    display:flex;gap:var(--gap);
    overflow-x:auto;scroll-snap-type:x mandatory;
    scroll-behavior:smooth;
    padding-bottom:22px;
    scrollbar-width:none;
    cursor:grab;
  }
  .rail::-webkit-scrollbar{display:none}
  .rail.dragging{cursor:grabbing;scroll-behavior:auto;scroll-snap-type:none}

  .card{
    position:relative;flex:0 0 var(--card-w);
    aspect-ratio:3/4.15;
    scroll-snap-align:start;
    border-radius:var(--radius);
    overflow:hidden;
    background:var(--ink);
    isolation:isolate;
    text-decoration:none;color:inherit;
    display:block;
  }
  .card:focus-visible{outline:2px solid var(--green);outline-offset:3px}

  /* image layer — swap the --img url per slide */
  .shot{
    position:absolute;inset:0;
    background-size:cover;background-position:center;
    transform:scale(1.02);
    transition:transform .9s cubic-bezier(.2,.7,.2,1);
  }
  .card:hover .shot{transform:scale(1.07)}

  /* placeholder shown when no --img is set */
  .shot.empty{
    background:
      repeating-linear-gradient(135deg,#20272400 0 11px,#ffffff0a 11px 12px),
      linear-gradient(160deg,#1C2320 0%,#0B0F0D 70%);
  }
  .shot.empty::after{
    content:attr(data-slot);
    position:absolute;left:18px;top:18px;right:18px;
    font-family:var(--mono);font-size:10px;letter-spacing:.12em;
    text-transform:uppercase;color:#ffffff55;line-height:1.6;
  }

  .scrim{
    position:absolute;inset:0;
    background:linear-gradient(to top,
      rgba(6,9,8,.94) 0%,
      rgba(6,9,8,.80) 26%,
      rgba(6,9,8,.30) 55%,
      rgba(6,9,8,.10) 100%);
  }

  .card-body{
    position:absolute;left:0;right:0;bottom:0;
    padding:24px 22px 26px;color:#fff;
    display:flex;flex-direction:column;gap:10px;
  }
  .tag{
    font-family:var(--mono);font-size:10px;letter-spacing:.16em;
    text-transform:uppercase;color:var(--green);
    display:flex;align-items:center;gap:8px;
  }
  .tag b{color:#ffffff70;font-weight:400}
  .card h3{
    font-size:20px;line-height:1.22;font-weight:700;
    letter-spacing:-.018em;text-wrap:balance;
  }
  .card p{
    font-size:12.5px;line-height:1.55;color:#ffffffa8;font-weight:400;
    max-width:30ch;
  }

  /* ---------- Signature: the live filter counter (slide 2) ---------- */
  .stats{
    position:absolute;inset:0;display:flex;flex-direction:column;
    justify-content:space-between;padding:26px 22px;
    background:linear-gradient(165deg,#0E1512 0%,#060908 100%);
  }
  .stats .grid{
    display:grid;grid-template-columns:1fr 1fr;gap:1px;
    background:#ffffff14;border:1px solid #ffffff14;margin-top:auto;
  }
  .cell{background:#0B100E;padding:14px 12px}
  .cell .n{
    font-family:var(--mono);font-size:22px;font-weight:600;color:#fff;
    letter-spacing:-.02em;line-height:1;
  }
  .cell .l{
    font-family:var(--mono);font-size:9px;letter-spacing:.1em;
    text-transform:uppercase;color:#ffffff5e;margin-top:7px;line-height:1.4;
  }
  .ticker{
    border:1px solid var(--green);border-radius:3px;
    padding:16px 14px 14px;background:#00713A1a;
  }
  .ticker .live{
    font-family:var(--mono);font-size:9px;letter-spacing:.16em;
    text-transform:uppercase;color:var(--green);
    display:flex;align-items:center;gap:7px;
  }
  .dot{
    width:6px;height:6px;border-radius:50%;background:var(--green);
    animation:pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
  .ticker .count{
    font-family:var(--mono);font-size:clamp(28px,4.2vw,36px);font-weight:600;
    color:#fff;letter-spacing:-.03em;margin-top:10px;
    font-variant-numeric:tabular-nums;line-height:1;
  }
  .ticker .sub{
    font-size:11.5px;color:#ffffff9c;margin-top:9px;line-height:1.5;
  }

  /* ---------- Video slide ---------- */
  .play{
    position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
    width:58px;height:58px;border-radius:50%;
    border:1px solid #ffffff6b;background:#ffffff14;
    backdrop-filter:blur(3px);
    display:grid;place-items:center;
    transition:background .35s ease,border-color .35s ease,transform .35s ease;
  }
  .card:hover .play{background:var(--green);border-color:var(--green);transform:translate(-50%,-50%) scale(1.07)}
  .play::after{
    content:"";width:0;height:0;margin-left:3px;
    border-left:12px solid #fff;
    border-top:7.5px solid transparent;border-bottom:7.5px solid transparent;
  }

  /* ---------- Controls ---------- */
  .controls{
    max-width:1240px;margin:14px auto 0;padding:0 32px;
    display:flex;align-items:center;justify-content:space-between;gap:24px;
  }
  .bar{position:relative;flex:1;height:1px;background:var(--hair)}
  .bar span{
    position:absolute;top:-1px;left:0;height:3px;background:var(--ink);
    transition:width .35s ease,left .35s ease;
  }
  .btns{display:flex;gap:8px}
  .btn{
    width:42px;height:42px;border-radius:50%;
    border:1px solid var(--hair);background:var(--paper);
    display:grid;place-items:center;cursor:pointer;
    transition:border-color .25s ease,background .25s ease,color .25s ease;
    color:var(--ink);
  }
  .btn:hover:not(:disabled){background:var(--ink);border-color:var(--ink);color:#fff}
  .btn:disabled{opacity:.3;cursor:default}
  .btn:focus-visible{outline:2px solid var(--green);outline-offset:2px}
  .btn svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.6}
  .idx{
    font-family:var(--mono);font-size:11px;color:var(--grey);
    letter-spacing:.08em;min-width:52px;
  }
  .idx b{color:var(--ink);font-weight:600}

  @media (max-width:760px){
    :root{--card-w:262px;--gap:12px}
    body{padding:44px 0 64px}
    .head{flex-direction:column;align-items:flex-start;gap:14px;padding:0 20px}
    .head-right{text-align:left}
    .rail-wrap,.controls{padding:0 20px}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important;scroll-behavior:auto!important}
  }
</style>
</head>
<body>

  <header class="head">
    <div>
      <div class="eyebrow">MRH × MANN+HUMMEL</div>
      <h2>Eighty-five years of filtration, now <em>made in India</em>.</h2>
    </div>
    <div class="head-right">
      08 CHAPTERS<br>
      DRAG · SCROLL · ARROWS
    </div>
  </header>

  <div class="rail-wrap">
    <div class="rail" id="rail" tabindex="0" aria-label="MANN+HUMMEL brand story, 8 slides"></div>
  </div>

  <div class="controls">
    <div class="idx"><b id="cur">01</b> / 08</div>
    <div class="bar"><span id="bar"></span></div>
    <div class="btns">
      <button class="btn" id="prev" aria-label="Previous slide">
        <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <button class="btn" id="next" aria-label="Next slide">
        <svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>
      </button>
    </div>
  </div>

<script>
/* ────────────────────────────────────────────────────────────
   DROP YOUR IMAGES IN HERE — set `img` to a file path or URL.
   Leave it as "" to keep the labelled placeholder slot.
   ──────────────────────────────────────────────────────────── */
const SLIDES = [
  {
    tag:"Origin", year:"Ludwigsburg",
    title:"Global headquarters in Germany",
    copy:"The Ludwigsburg campus, where MANN+HUMMEL filtration has been engineered since 1941.",
    img:"", slot:"IMAGE SLOT 01 — MANN+HUMMEL HQ building, Ludwigsburg (green glass façade exterior)"
  },
  {
    type:"stats",
    tag:"Legacy", year:"Since 1941",
    title:"MANN+HUMMEL legacy",
    copy:""
  },
  {
    tag:"Agreement", year:"Symposium",
    title:"A perpetual exclusive manufacturing and distribution license agreement",
    copy:"MRH and MANN+HUMMEL formalise a partnership built to last — signed at the Air Pollution Symposium.",
    img:"", slot:"IMAGE SLOT 03 — Signing / handshake moment at the symposium stage"
  },
  {
    tag:"Manufacturing", year:"India",
    title:"Aligned with Make in India",
    copy:"German filtration technology, manufactured on Indian soil, for Indian air.",
    img:"", slot:"IMAGE SLOT 04 — Make in India manufacturing floor / production line"
  },
  {
    tag:"Validation", year:"Automotive",
    title:"Proven with leading OEMs",
    copy:"The same filtration trusted by the world's leading automotive manufacturers.",
    img:"", slot:"IMAGE SLOT 05 — Automotive OEM / filter production or vehicle line"
  },
  {
    tag:"Partnership", year:"MRH",
    title:"Strategic partnership with MRH",
    copy:"Two engineering teams, one standard — bringing clean air technology to market across India.",
    img:"", slot:"IMAGE SLOT 06 — MRH × MANN+HUMMEL team / leadership group photo"
  },
  {
    tag:"Symposium", year:"New Delhi",
    title:"Symposium on Air Pollution",
    copy:"Shri Tarun Kapoor, Advisor to the Prime Minister's Office, on India's clean air imperative.",
    img:"", slot:"IMAGE SLOT 07 — Shri Tarun Kapoor addressing the symposium"
  },
  {
    type:"video",
    tag:"Film", year:"02:14",
    title:"85+ years of global filtration leadership",
    copy:"Watch how a MANN+HUMMEL filter is made.",
    img:"", slot:"IMAGE SLOT 08 — Video poster frame: filter media / production close-up"
  }
];

/* ── Build slides ── */
const rail = document.getElementById('rail');

SLIDES.forEach((s,i)=>{
  const a = document.createElement('a');
  a.className='card';
  a.href='#';
  a.setAttribute('aria-label', s.title);

  if(s.type === 'stats'){
    a.innerHTML = `
      <div class="stats">
        <div class="ticker">
          <div class="live"><span class="dot"></span>Producing now</div>
          <div class="count" id="tick">0</div>
          <div class="sub">filters made since you opened this page — at 32 every second.</div>
        </div>
        <div class="grid">
          <div class="cell"><div class="n">1941</div><div class="l">Founded</div></div>
          <div class="cell"><div class="n">€4.7B</div><div class="l">Revenue</div></div>
          <div class="cell"><div class="n">80+</div><div class="l">Locations</div></div>
          <div class="cell"><div class="n">32/sec</div><div class="l">Filters made</div></div>
        </div>
      </div>
      <div class="card-body" style="position:relative;padding:0 22px 24px;">
        <div class="tag">${s.tag} <b>· ${s.year}</b></div>
        <h3>${s.title}</h3>
      </div>`;
    a.style.background = '#0B100E';
    a.querySelector('.card-body').style.background = 'linear-gradient(to top, #060908 60%, transparent)';
    a.querySelector('.card-body').style.marginTop = '-90px';
  } else {
    const hasImg = s.img && s.img.length;
    a.innerHTML = `
      <div class="shot ${hasImg?'':'empty'}" ${hasImg?`style="background-image:url('${s.img}')"`:''} data-slot="${s.slot||''}"></div>
      <div class="scrim"></div>
      ${s.type==='video' ? '<div class="play"></div>' : ''}
      <div class="card-body">
        <div class="tag">${s.tag} <b>· ${s.year}</b></div>
        <h3>${s.title}</h3>
        <p>${s.copy}</p>
      </div>`;
  }
  rail.appendChild(a);
});

/* ── Live filter counter (the signature) ── */
const tick = document.getElementById('tick');
if(tick && !matchMedia('(prefers-reduced-motion: reduce)').matches){
  const t0 = Date.now();
  setInterval(()=>{
    const n = Math.floor((Date.now()-t0)/1000 * 32);
    tick.textContent = n.toLocaleString('en-IN');
  }, 90);
} else if(tick){ tick.textContent = "32 / sec"; }

/* ── Navigation ── */
const prev = document.getElementById('prev');
const next = document.getElementById('next');
const bar  = document.getElementById('bar');
const cur  = document.getElementById('cur');

const step = () => {
  const c = rail.querySelector('.card');
  return c.getBoundingClientRect().width + parseFloat(getComputedStyle(rail).gap);
};

prev.onclick = ()=> rail.scrollBy({left:-step(), behavior:'smooth'});
next.onclick = ()=> rail.scrollBy({left: step(), behavior:'smooth'});

function sync(){
  const max = rail.scrollWidth - rail.clientWidth;
  const p   = max > 0 ? rail.scrollLeft / max : 0;
  const visible = rail.clientWidth / rail.scrollWidth;

  bar.style.width = (visible*100)+'%';
  bar.style.left  = (p*(100-visible*100))+'%';

  const i = Math.min(SLIDES.length, Math.round(rail.scrollLeft/step())+1);
  cur.textContent = String(i).padStart(2,'0');

  prev.disabled = rail.scrollLeft < 4;
  next.disabled = rail.scrollLeft > max - 4;
}
rail.addEventListener('scroll', sync, {passive:true});
window.addEventListener('resize', sync);
sync();

/* ── Drag to scrub ── */
let down=false, x0=0, s0=0;
rail.addEventListener('pointerdown', e=>{
  down=true; x0=e.clientX; s0=rail.scrollLeft; rail.classList.add('dragging');
});
window.addEventListener('pointermove', e=>{
  if(!down) return;
  rail.scrollLeft = s0 - (e.clientX - x0);
});
window.addEventListener('pointerup', ()=>{
  if(!down) return;
  down=false; rail.classList.remove('dragging'); sync();
});

/* ── Keyboard ── */
rail.addEventListener('keydown', e=>{
  if(e.key==='ArrowRight'){ e.preventDefault(); next.click(); }
  if(e.key==='ArrowLeft'){  e.preventDefault(); prev.click(); }
});
</script>
</body>
</html>
